services:
  api:
    build: .
    env_file:
      - .env
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
    restart: always
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.baseUrlPath /dashboard

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - dashboard
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    env_file:
      - .env
    restart: always

volumes:
  caddy_data:
